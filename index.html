<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Forca - Temas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Jogo da Forca</h1>
    <div id="tema">
        <h2>Escolha o tema:</h2>
        <button onclick="selecionarTema('informatica')">Informática Básica</button>
        <button onclick="selecionarTema('redes')">Redes de Computadores</button>
        <button onclick="selecionarTema('hardware')">Hardware</button>
    </div>

    <div id="jogo" style="display:none;">
        <div id="contador">Tempo: 0s</div>
        <div id="pontuacao">Pontos: 0</div>
        <div id="palavra"></div>
        <div id="letras"></div>
        <img id="imagemForca" src="forca0.png" alt="Forca" style="width:200px; margin:20px;">
        <div id="forca-desenho">Erros: 0</div>
        <button onclick="reiniciarJogo()">Reiniciar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
